apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab4-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: lab4-app
  template:
    metadata:
      labels:
        app: lab4-app
    spec:
      containers:
        - name: app
          image: lab4-app:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          env:
            - name: DB_PASSWORD          # injected from a Kubernetes Secret, never stored in Git
              valueFrom:
                secretKeyRef:
                  name: lab4-app-secrets
                  key: DB_PASSWORD
          readinessProbe:
            httpGet: { path: /health, port: 5000 }
            periodSeconds: 5
