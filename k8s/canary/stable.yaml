apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-stable
spec:
  replicas: 4
  selector:
    matchLabels: { app: canary-app, track: stable }
  template:
    metadata:
      labels: { app: canary-app, track: stable }
    spec:
      containers:
        - name: app
          image: lab4-app:1.0
          imagePullPolicy: IfNotPresent
          env:
            - { name: APP_VERSION, value: "1.0" }
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet: { path: /health, port: 5000 }
            periodSeconds: 3
