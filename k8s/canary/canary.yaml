apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-canary
spec:
  replicas: 1          # 1 of 5 pods = ~20% of traffic
  selector:
    matchLabels: { app: canary-app, track: canary }
  template:
    metadata:
      labels: { app: canary-app, track: canary }
    spec:
      containers:
        - name: app
          image: lab4-app:2.0
          imagePullPolicy: IfNotPresent
          env:
            - { name: APP_VERSION, value: "2.0" }
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet: { path: /health, port: 5000 }
            periodSeconds: 3
