# HashiCorp Vault (dev mode, for the lab). The root token comes from the Secret "vault-root",
# which is created at install time and is NOT stored in Git.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vault
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vault
  template:
    metadata:
      labels:
        app: vault
    spec:
      containers:
        - name: vault
          image: hashicorp/vault:1.17
          args: ["server", "-dev"]
          env:
            - name: VAULT_DEV_LISTEN_ADDRESS
              value: "0.0.0.0:8200"
            - name: VAULT_DEV_ROOT_TOKEN_ID
              valueFrom:
                secretKeyRef:
                  name: vault-root
                  key: token
          ports:
            - containerPort: 8200
---
apiVersion: v1
kind: Service
metadata:
  name: vault
spec:
  type: NodePort        # reachable by the Jenkins pipeline on the Minikube node IP
  selector:
    app: vault
  ports:
    - port: 8200
      targetPort: 8200
      nodePort: 30820
