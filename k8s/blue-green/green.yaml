apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-green
spec:
  replicas: 2
  selector:
    matchLabels: { app: bg-app, slot: green }
  template:
    metadata:
      labels: { app: bg-app, slot: green }
    spec:
      containers:
        - name: app
          image: lab4-app:2.0
          imagePullPolicy: IfNotPresent
          env:
            - { name: APP_VERSION, value: "2.0" }
            - { name: APP_COLOR, value: "green" }
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet: { path: /health, port: 5000 }
            periodSeconds: 3
